<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Sign in to StreamFlix to watch movies and TV shows.">
    <title>Sign In — StreamFlix</title>
    <link rel="icon" href="/content/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/content/catalog.css">
    <link rel="stylesheet" href="/content/site.css">
    <script type="module" src="/content/auth.js"></script>
  </head>
  <body class="auth-page" data-auth="login">
    <a class="brand" href="/">STREAMFLIX</a>
    <main class="auth-card">
      <h1>Sign In</h1>
      <p class="form-error" id="auth-error" role="alert" hidden></p>
      <form id="auth-form" novalidate>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="password" type="password" autocomplete="current-password" minlength="8" required>
        </label>
        <button class="button button-primary" type="submit">Sign In</button>
      </form>
      <p class="auth-alt">New to StreamFlix? <a id="alt-link" href="/signup.html">Create an account</a>.</p>
    </main>
  </body>
</html>
