<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <title>StreamFlix</title>
    <link rel="stylesheet" href="content/catalog.css">
    <script src="content/landing.js" defer></script>
    <style>
      .landing {
        min-height: 100vh; display: grid; place-items: center; padding: 30px;
        text-align: center;
        background:
          linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.88)),
          url("images/netflix clone home page background image multiple shows collage.jpg") center/cover;
      }
      .landing .brand { position: absolute; top: 28px; left: clamp(22px,5vw,72px); }
      .landing-copy { width: min(820px, 94vw); }
      .landing h1 { margin: 0; font-size: clamp(42px, 7vw, 78px); line-height: 1.02; letter-spacing: -.04em; }
      .landing p { margin: 22px 0 34px; color: #ddd; font-size: clamp(18px,2vw,26px); }
      .landing-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <main class="landing">
      <a class="brand" href="/" data-site-name>STREAMFLIX</a>
      <section class="landing-copy">
        <h1 id="landing-title">Unlimited movies, TV shows, and more.</h1>
        <p id="landing-subtitle">Watch anywhere. Cancel anytime.</p>
        <div class="landing-actions">
          <a class="button button-primary" href="user_dashboard/browse.html">Browse catalog</a>
          <a class="button button-secondary" href="/admin/">Manage content</a>
        </div>
      </section>
    </main>
  </body>
</html>
