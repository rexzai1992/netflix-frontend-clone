<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Stream movies and TV shows on StreamFlix. Watch anywhere, cancel anytime.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StreamFlix">
    <meta property="og:title" content="StreamFlix — Unlimited movies, TV shows, and more">
    <meta property="og:description" content="Stream movies and TV shows on StreamFlix. Watch anywhere, cancel anytime.">
    <meta property="og:image" content="/content/favicon.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="StreamFlix — Unlimited movies, TV shows, and more">
    <meta name="twitter:description" content="Stream movies and TV shows on StreamFlix. Watch anywhere, cancel anytime.">
    <title>StreamFlix — Unlimited movies, TV shows, and more</title>
    <link rel="icon" href="/content/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/content/catalog.css">
    <link rel="stylesheet" href="/content/site.css">
    <script type="module" src="/content/landing.js"></script>
  </head>
  <body class="landing-page">
    <header class="landing-top">
      <a class="brand" href="/" data-site-name>STREAMFLIX</a>
      <a class="button button-secondary" id="top-auth" href="/login.html">Sign In</a>
    </header>
    <main>
      <section class="landing-hero" id="landing-hero">
        <div class="landing-shade"></div>
        <div class="landing-copy">
          <p class="eyebrow" id="landing-kicker">Now streaming</p>
          <h1 id="landing-title">Unlimited movies, TV shows, and more.</h1>
          <p class="landing-subtitle" id="landing-subtitle">Watch anywhere. Cancel anytime.</p>
          <div class="landing-actions" id="landing-actions">
            <a class="button button-primary" href="/signup.html">Get Started</a>
            <a class="button button-secondary" href="/login.html">Sign In</a>
          </div>
        </div>
      </section>
      <section class="landing-teaser" id="landing-teaser" aria-label="A taste of the catalog" hidden>
        <h2>Fresh on <span data-site-name-plain>StreamFlix</span></h2>
        <div class="teaser-row" id="teaser-row"></div>
      </section>
    </main>
    <footer>
      <p><span data-site-name-plain>StreamFlix</span> — a demo streaming service.</p>
      <p id="footer-attribution" hidden></p>
      <p>Includes open movies by Blender Foundation (CC-BY)</p>
    </footer>
  </body>
</html>
