<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="Create a StreamFlix account and start watching movies and TV shows.">
    <title>Sign Up — StreamFlix</title>
    <link rel="icon" href="/content/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/content/catalog.css">
    <link rel="stylesheet" href="/content/site.css">
    <script type="module" src="/content/auth.js"></script>
  </head>
  <body class="auth-page" data-auth="signup">
    <a class="brand" href="/">STREAMFLIX</a>
    <main class="auth-card">
      <h1>Create your account</h1>
      <p class="form-error" id="auth-error" role="alert" hidden></p>
      <form id="auth-form" novalidate>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label class="field">
          <span>Password (at least 8 characters)</span>
          <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="field">
          <span>Confirm password</span>
          <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button class="button button-primary" type="submit">Get Started</button>
      </form>
      <p class="auth-alt">Already have an account? <a id="alt-link" href="/login.html">Sign in</a>.</p>
    </main>
  </body>
</html>
