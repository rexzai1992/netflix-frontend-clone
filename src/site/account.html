<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070707">
    <meta name="description" content="Manage your StreamFlix account, subscription, and password.">
    <title>Account — StreamFlix</title>
    <link rel="icon" href="/content/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/content/catalog.css">
    <link rel="stylesheet" href="/content/site.css">
    <script type="module" src="/content/account.js"></script>
  </head>
  <body>
    <header class="topbar scrolled">
      <a class="brand" href="/user_dashboard/browse.html" data-site-name>STREAMFLIX</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="/user_dashboard/browse.html">Back to Browse</a>
      </nav>
      <div class="top-actions">
        <button class="pill-link" id="sign-out" type="button">Sign Out</button>
      </div>
    </header>

    <main class="account">
      <h1>Account</h1>
      <div class="status" id="account-status">Loading your account…</div>
      <div class="notice" id="checkout-notice" hidden></div>

      <section class="panel" id="profile-panel" hidden>
        <h2>Profile</h2>
        <p>Signed in as <strong id="account-email"></strong></p>
      </section>

      <section class="panel" id="subscription-panel" hidden>
        <h2>Subscription</h2>
        <div id="subscription-body"></div>
      </section>

      <section class="panel" id="password-panel" hidden>
        <h2>Change password</h2>
        <p class="hint">Changing your password signs you out on your other devices.</p>
        <p class="form-error" id="password-error" role="alert" hidden></p>
        <p class="form-message" id="password-message" role="status" hidden></p>
        <form id="password-form" novalidate>
          <label class="field">
            <span>Current password</span>
            <input id="current-password" type="password" autocomplete="current-password" required>
          </label>
          <label class="field">
            <span>New password (at least 8 characters)</span>
            <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span>Confirm new password</span>
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <button class="button button-primary" type="submit">Update password</button>
        </form>
      </section>
    </main>

    <footer>
      <p><span data-site-name-plain>StreamFlix</span> — a demo streaming service.</p>
      <p>Includes open movies by Blender Foundation (CC-BY)</p>
    </footer>
  </body>
</html>
